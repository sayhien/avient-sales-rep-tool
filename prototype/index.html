    if(sh.what==='promise') c.promises.splice(+sh.i,1);
    if(sh.what==='product') c.products.splice(+sh.i,1);
    if(sh.what==='file') c.files.splice(+sh.i,1);
    if(sh.what==='note') c.timeline.splice(+sh.i,1);
    closeSheet(); toast('Removed.');
  },
  prom:function(i){var c=cust(S.rec||'best'), p=c.promises[+i]; p.done=!p.done}
};

/* ---------- events ---------- */
screenEl.addEventListener('click',function(e){
  if(e.target.closest('#splash')){ hideSplash(); return; }
  var tb=e.target.closest('[data-tour]'); if(tb){ tourAct(tb.dataset.tour); return; }
  if(S.tour) return;
  if(Date.now()<swallow){ swallow=0; return; }
  var mbtn=e.target.closest('[data-menu]');
  if(MENU){
    if(e.target.closest('#menu')){ var mo=e.target.closest('.mo'), cd=e.target.closest('[data-day]'), cn=e.target.closest('[data-cal]'), cm=e.target.closest('[data-cmode]'), cp=e.target.closest('[data-cpick]');
      if(mo) menuPick(+mo.dataset.i); else if(cd){ if(!cd.disabled) datePick(cd.dataset.day); } else if(cn&&!cn.disabled) calNav(cn.dataset.cal); else if(cm) calMode(cm.dataset.cmode); else if(cp&&!cp.disabled) calPick(cp.dataset.cpick);
      return; }
    var same=mbtn===MENU.btn; menuClose(same); if(same||!mbtn) return;   /* a tap outside an open menu only closes the menu */
  }
  if(mbtn){ menuOpen(document.getElementById(mbtn.dataset.menu)); return; }
  if(e.target.classList.contains('ask')){ A.stay(); return; }
  if(e.target.matches('[data-scrim]')){ if(tryClose(true)) render(); return; }
  if(e.target.closest('[data-fab]')){ setFan(!S.fan); return; }
  if(S.capm&&!e.target.closest('.capw')){ S.capm=false; render(); return; }
  var b=e.target.closest('[data-act]'); if(!b) return;
  var fn=A[b.dataset.act]; if(!fn) return;
  var s0=S.sheet, k0=s0&&isForm(s0)?(s0.kept||sheetKey(s0)):null, r0=S.rec||'best';
  var res=fn(b.dataset.id,b.dataset.deal,b);
  /* a form that was saved has no kept copy. A change in a list also clears the kept edits of that list, because the positions move. */
  if(k0&&DONE[b.dataset.act]&&S.sheet!==s0){ delete S.kept[k0];
    if(s0.kind==='add') Object.keys(S.kept).forEach(function(k){ if(k.indexOf('add:'+s0.what+':')===0&&k.slice(-r0.length-1)===':'+r0&&k.indexOf(':new:')<0) delete S.kept[k] }); }
  if(res!==false) render();
});
screenEl.addEventListener('pointerdown',function(e){
  if(S.tour||!e.target.closest('[data-fab]')) return; held=false; clearTimeout(holdTimer);
  holdTimer=setTimeout(function(){ held=true; S.fan=false; if(!noCust()) S.sheet={kind:'talk',hint:null}; render(); },480);
});
['pointerup','pointercancel','pointerleave'].forEach(function(ev){screenEl.addEventListener(ev,function(){clearTimeout(holdTimer); if(held){held=false;swallow=Date.now()+350}})});
screenEl.addEventListener('contextmenu',function(e){ if(e.target.closest('[data-fab]')) e.preventDefault() });
screenEl.addEventListener('focusin',function(e){ var t=e.target; if(t.classList&&t.classList.contains('nat')){ var fb=faceOf(t); if(fb){ try{fb.focus({preventScroll:true})}catch(_){} } } });
document.addEventListener('pointerdown',function(e){ if(MENU&&!screenEl.contains(e.target)) menuClose() });
screenEl.addEventListener('input',function(e){
  if(e.target.id==='menu-q'){ if(MENU){ MENU.q=e.target.value; MENU.act=-1; var ml=MENU.pop.querySelector('.mlist'); ml.innerHTML=menuList(); ml.scrollTop=0; var f1=ml.querySelector('.mo'); if(f1&&MENU.q.trim()) menuAct(+f1.dataset.i); } return; }
  if(e.target.classList&&e.target.classList.contains('nat')) faceSync(e.target);
  if(e.target.id==='q'){ S.q=e.target.value; S.recN=20; S.page=0; var l=$('#rlist'); if(l) l.innerHTML=recRows(); var rc=$('#rcount'); if(rc) rc.textContent=recCount(recFiltered().length); }
  if(e.target.id==='c-addr'&&S.sheet) addrInput(e.target.value);
  if(e.target.id==='t-text'&&S.sheet) guideSync(e.target.value,S.sheet.hint);
  var ft=e.target.dataset?e.target.dataset.ft:'';
  if(ft==='phone'){ var pv=e.target.value, cl=pv.replace(/[^\d+ ]/g,'').replace(/(?!^)\+/g,''); if(cl!==pv){ var pos=Math.max(0,(e.target.selectionStart||cl.length)-(pv.length-cl.length)); e.target.value=cl; try{e.target.setSelectionRange(pos,pos)}catch(_){} } }
  if(ft==='money'){ var dg=e.target.value.replace(/[^\d]/g,'').slice(0,9); e.target.value=dg?Number(dg).toLocaleString('en-US'):''; }
  if(ft&&e.target.classList.contains('bad')) fshow(e.target);
  if(e.target.id==='n-name'){ var v=e.target.value.trim().toLowerCase(), box=$('#n-dup'), m=v.length>2?C.find(function(c){var n=c.name.toLowerCase();return n.indexOf(v)>-1||v.indexOf(n.replace(/ pte ltd$/,''))>-1}):null;
    box.innerHTML=m?'<p class="alert">'+esc(m.name)+' is already in your records. <button data-act="rec" data-id="'+m.id+'">Open it</button></p>':''; }
});
/* a field is checked when he leaves it, but not when the next tap is on a button: the button does the check */
var tapAt=0;
screenEl.addEventListener('pointerdown',function(e){ if(e.target.closest('.sheet button, .sheet .chk')) tapAt=Date.now() },true);
screenEl.addEventListener('focusout',function(e){
  var el=e.target; if(!S.sheet||!el.dataset||!el.dataset.ft||Date.now()-tapAt<700) return;
  if(!el.value.trim()&&!el.classList.contains('bad')) return;
  fnorm(el); fshow(el);
});
screenEl.addEventListener('change',function(e){
  var t=e.target; if(t.id==='menu-q') return;
  if(t.classList&&t.classList.contains('nat')) faceSync(t);
  if(t.id==='a-1'&&S.sheet&&S.sheet.what==='product'){ var w2=$('#a-2w'); if(w2){ w2.hidden=!!t.value; fset(t,''); if(!t.value){ try{$('#a-2').focus()}catch(_){} } } }
  if(t.dataset&&t.dataset.ft==='pick'&&t.classList.contains('bad')) fshow(t);
  if(t.id==='r-cust'){ readDraft(); var r=S.draft, id=t.value, d=id?openOf(id)[0]:null; r.cust=id; r.sure=!!id; r.deal=d?d.id:''; r.stageTo=d?d.stage:null; render(); }
  if(t.id==='r-sort'){ S.sort=t.value; S.page=0; render(); }
  if(t.id==='s-lang'){ S.set.lang=t.value; toast('Voice language: '+t.value+'.'); }
  if(t.id==='r-padd'&&t.value&&S.draft){ readDraft(); S.draft.prods.push(t.value); render(); }
  if(t.id==='n-photo'&&t.files&&t.files[0]&&S.sheet&&(S.sheet.kind==='attach'||S.sheet.kind==='photo')){ var pf=t.files[0];
    if(!/^image\//.test(pf.type)&&!/\.(jpe?g|png|heic|webp|gif)$/i.test(pf.name)){ S.sheet.err='This file is not a picture. Choose a JPG, PNG or HEIC file.'; S.sheet.file=null; }
    else { S.sheet.file={name:pf.name,url:/heic$/i.test(pf.name)?'':URL.createObjectURL(pf)}; S.sheet.err=''; }
    render(); }
  if(t.id==='a-file'&&t.files&&t.files[0]){ var f0=t.files[0];
    if(!/\.(pdf|docx?|xlsx?|pptx?|jpe?g|png|heic|webp|gif)$/i.test(f0.name)){ fset(t,'This file type does not work here. Use a photo, a PDF or an office file.'); t.value=''; return; }
    if(f0.size>10*1024*1024){ fset(t,'This file is larger than 10 MB. Choose a smaller file.'); t.value=''; return; }
    var c=cust(S.rec||'best'); c.files.unshift(f0.name); closeSheet(); render(); toast('File added.'); }
});
document.addEventListener('keydown',function(e){
  var typing=/INPUT|TEXTAREA|SELECT/.test((e.target&&e.target.tagName)||'');
  if(S.tour){ if(e.key==='Escape') tourEnd(false); else if(e.key==='ArrowRight') tourAct('next'); else if(e.key==='ArrowLeft') tourAct('back'); return; }
  if(MENU){ if(menuKey(e)) return; }
  var mk=e.target&&e.target.closest?e.target.closest('[data-menu]'):null;
  if(mk&&(e.key==='ArrowDown'||e.key==='ArrowUp')){ e.preventDefault(); menuOpen(document.getElementById(mk.dataset.menu)); return; }
  if(S.capm&&(e.key==='ArrowDown'||e.key==='ArrowUp')){ var cm=[].slice.call(app.querySelectorAll('.capm button')), ci=cm.indexOf(document.activeElement);
    e.preventDefault(); cm[(ci+(e.key==='ArrowDown'?1:cm.length-1))%cm.length].focus(); return; }
  if(e.key==='Escape'){ if(S.sheet){ if(askOpen()) A.stay(); else if(tryClose()) render(); } else if(S.fan){setFan(false)} else if(S.capm){S.capm=false;render()} else if(S.rec&&S.device!=='tablet'){S.rec=null;S.edit=false;render()} return; }
  if(!typing&&!S.sheet&&S.device==='computer'&&(e.key==='n'||e.key==='N')&&!e.metaKey&&!e.ctrlKey&&!e.altKey){ e.preventDefault(); S.capm=false; if(!noCust()) S.sheet={kind:'type',hint:S.rec}; render(); }
});

/* ---------- device switch and fit ---------- */
var DIM={phone:[376,756],tablet:[944,664],computer:[1252,750]};
var HINT={phone:'Tap the round button to add a note, or hold it to talk at once.',
 tablet:'The same screens as the phone, with more side by side.',
 computer:'The same screens, with room for a full table. Select New note, or press N.'};
function fit(){
  var st=$('#stage'), d=DIM[S.device], cs=getComputedStyle(st);
  var w=st.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight), h=st.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  var k=Math.max(.2,Math.min(w/d[0],h/d[1],1.5));
  $('#fit').style.width=d[0]*k+'px'; $('#fit').style.height=d[1]*k+'px'; $('#dev').style.transform='scale('+k+')';
}
function setDevice(dv){
  if(S.tour) tourEnd(false,true);
  var keptNow=S.sheet&&sheetDirty()?keepForm():null;
  closeSheet(); S.device=dv; S.fan=false; S.edit=false; if(dv==='computer') S.rec=null;
  if(dv==='phone'&&S.tab==='set'){}
  $('#dev').dataset.device=dv; $('#hint').textContent=HINT[dv];
  ['phone','tablet','computer'].forEach(function(x){$('#dev-'+x).setAttribute('aria-pressed',String(x===dv))});
  toastEl.hidden=true; applySettings(); render(); fit();
  if(keptNow) toast('Kept for later. Find it at the top of Home.',keptNow,'kept');
}
document.querySelector('.seg').addEventListener('click',function(e){var b=e.target.closest('[data-dev]'); if(b) setDevice(b.dataset.dev)});
window.addEventListener('resize',function(){ menuClose(); fit(); tourPlace(); });
screenEl.addEventListener('scroll',function(e){ if(MENU&&!MENU.pop.contains(e.target)) menuClose(); var sc=e.target; if(sc&&sc.dataset&&sc.dataset.scroll){ revealCheck(sc); spyOne(sc); } if(sc&&sc.hasAttribute&&sc.hasAttribute('data-drag')){ DX[dragKey(sc)]=sc.scrollLeft; edges(sc); } },true);
setInterval(revealAll,500);
$('#wx-sel').addEventListener('change',function(e){ S.wx=e.target.value; render(); });
var DATA=/^(0|8|100)$/.test(QS.data||'')?QS.data:(QS.embed?'8':'100');
if(DATA==='8'){ var o8=document.createElement('option'); o8.value='8'; o8.textContent='8 customers'; $('#data-sel').insertBefore(o8,$('#data-sel').lastElementChild); }
$('#data-sel').value=DATA; loadData(+DATA);
$('#data-sel').addEventListener('change',function(e){
  if(S.tour) tourEnd(false,true);
  DATA=e.target.value; loadData(+DATA); closeSheet();
  S.kept={}; S.done={}; S.rec=null; S.q=''; S.f='all'; S.fs=null; S.fw=2; S.notes=[]; S.notesAll=false; S.sort='name'; S.recN=20; S.page=0; S.tlN=5; S.secAll={}; S.dayAll={}; S.attnAll=false; S.weekAll=false; S.more=false; S.stage=null; S.fan=false;
  render(); toast('Sample data: '+DATA+' customers.');
});
window.__tidy=tidy; window.__addr=addrLocal;
if(QS.wx&&WX[QS.wx]){ S.wx=QS.wx; $('#wx-sel').value=QS.wx; }
/* the time of day: the clock of the device. A link can set a time for a recording. Inside the presentation the story starts in the morning. */
if(/^\d{1,2}:\d{2}$/.test(QS.time||'')) S.clock=QS.time; else if(QS.embed&&QS.time!=='clock') S.clock='8:20';
if(QS.tab==='rec'||QS.tab==='set') S.tab=QS.tab;
if(QS.rec&&cust(QS.rec)){ S.rec=QS.rec; if(QS.device==='tablet') S.tab='rec'; }
setDevice(DIM[QS.device]?QS.device:'phone');
if(QS.rec&&cust(QS.rec)&&S.device==='computer'){ S.rec=QS.rec; render(); }
if(QS.splash==='1'||(!QS.embed&&QS.splash!=='0')) splash(); else { greetAt=Date.now(); introPending=true; render(); if(QS.tour==='1'){ tourAuto=false; setTimeout(tourStart,700); } }
if(QS.jump) setTimeout(function(){ var el=document.getElementById(QS.jump); if(el) el.scrollIntoView({block:'start'}); },500);
/* inside the presentation, pass the arrow keys up so the presenter can move on */
if(QS.embed) document.addEventListener('keydown',function(e){
  var typing=/INPUT|TEXTAREA|SELECT/.test((e.target&&e.target.tagName)||'');
  if(!typing&&/^(ArrowRight|ArrowLeft|PageDown|PageUp)$/.test(e.key)){ try{ window.parent.postMessage({hue:'nav',key:e.key},'*'); }catch(_){} }
});
})();
